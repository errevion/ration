name: Build Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      environment:
        description: Target deployment environment
        required: true
        default: prod
        type: choice
        options:
          - dev
          - prod

permissions:
  contents: write

jobs:
  build-apk:
    name: Assemble Android APK
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine environment parameters
        id: env-config
        run: |
          TARGET_ENV="prod"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TARGET_ENV="${{ github.event.inputs.environment }}"
          elif [[ "${{ github.ref_name }}" =~ -(dev|alpha|beta|rc) ]]; then
            TARGET_ENV="dev"
          fi

          if [[ "$TARGET_ENV" == "dev" ]]; then
            echo "apk_flavor=dev" >> $GITHUB_OUTPUT
            echo "app_name=Ration (Dev)" >> $GITHUB_OUTPUT
          else
            echo "apk_flavor=prod" >> $GITHUB_OUTPUT
            echo "app_name=Ration" >> $GITHUB_OUTPUT
          fi
          echo "target_env=$TARGET_ENV" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Run Expo prebuild
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --clean

      - name: Decode signing keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > apps/mobile/android/app/release.keystore

      - name: Assemble release APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Locate and sign assembled APK
        id: find-apk
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          APK_PATH=$(find apps/mobile/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: No APK found after build step."
            exit 1
          fi
          OUTPUT_NAME="ration-${{ steps.env-config.outputs.apk_flavor }}.apk"
          cp "$APK_PATH" "$OUTPUT_NAME"

          if [ -f apps/mobile/android/app/release.keystore ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "Signing APK with release keystore..."
            BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
            $BUILD_TOOLS_DIR/apksigner sign --ks apps/mobile/android/app/release.keystore \
              --ks-pass pass:"$KEYSTORE_PASSWORD" \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass pass:"$KEY_PASSWORD" \
              "$OUTPUT_NAME"
            $BUILD_TOOLS_DIR/apksigner verify "$OUTPUT_NAME"
          fi

          echo "apk_file=$OUTPUT_NAME" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.find-apk.outputs.apk_file }}
          path: ${{ steps.find-apk.outputs.apk_file }}
          retention-days: 14

      - name: Publish GitHub Release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find-apk.outputs.apk_file }}
          draft: false
          prerelease: ${{ steps.env-config.outputs.target_env == 'dev' }}
          generate_release_notes: true
