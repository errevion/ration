name: CI Quality Gate

on:
  pull_request:
    branches:
      - master
      - develop
  push:
    branches:
      - master
      - develop

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Invariants and Audit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Biome formatting and lint
        run: npx @biomejs/biome check .

      - name: Verify architectural invariants
        run: node scripts/verify-invariants.js

      - name: Run domain forensic audit test suites
        run: npm run test:audit
